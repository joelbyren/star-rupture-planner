<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="sun" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#fff7d6"/>
      <stop offset="35%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <clipPath id="round">
      <rect width="64" height="64" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <!-- backdrop -->
    <rect width="64" height="64" fill="url(#sky)"/>

    <!-- sun rays -->
    <g stroke="#fde047" stroke-width="2.4" stroke-linecap="round" opacity="0.55">
      <line x1="32" y1="2"  x2="32" y2="10"/>
      <line x1="3"  y1="29" x2="11" y2="29"/>
      <line x1="53" y1="29" x2="61" y2="29"/>
      <line x1="9"  y1="7"  x2="15" y2="13"/>
      <line x1="55" y1="7"  x2="49" y2="13"/>
    </g>

    <!-- big bright sun -->
    <circle cx="32" cy="29" r="19" fill="url(#sun)"/>
    <circle cx="32" cy="29" r="19" fill="none" stroke="#fff7d6" stroke-width="1" opacity="0.6"/>

    <!-- factory silhouette -->
    <g fill="#312e81">
      <!-- smokestacks -->
      <rect x="12" y="28" width="5" height="24" rx="1"/>
      <rect x="47" y="32" width="5" height="20" rx="1"/>
      <!-- sawtooth-roof main building -->
      <path d="M20 52V40l6-6v6l6-6v6l6-6v6l6-6v18z"/>
    </g>

    <!-- ground -->
    <rect x="0" y="51" width="64" height="13" fill="#1e1b4b"/>
  </g>
</svg>
